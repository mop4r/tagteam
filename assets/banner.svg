<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">TagTeam</title>
  <desc id="d">One conversation, three AIs: Claude Code, Gemini (Antigravity) and Grok CLI tag-team the same chat.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F19"/>
      <stop offset="1" stop-color="#1A1533"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".18" cy=".5" r=".45">
      <stop offset="0" stop-color="#D97757" stop-opacity=".28"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".2" r=".5">
      <stop offset="0" stop-color="#7C6CF6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7C6CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4A481"/>
      <stop offset=".5" stop-color="#C9B8FF"/>
      <stop offset="1" stop-color="#7FB2FF"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glowB)"/>

  <svg x="70" y="58" width="284" height="284" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="1" stop-color="#A86CF5"/>
    </linearGradient>
    <linearGradient id="cla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8906F"/>
      <stop offset="1" stop-color="#C8603F"/>
    </linearGradient>
    <linearGradient id="grk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A505C"/>
      <stop offset="1" stop-color="#14171D"/>
    </linearGradient>
    <marker id="aC" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97757"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B7CF6"/>
    </marker>
    <marker id="aK" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8D96A3"/>
    </marker>
  </defs>

  <!-- relay loop: each arc leaves one AI and reaches the next -->
  <g fill="none" stroke-width="16" stroke-linecap="round">
    <path d="M359 123 A180 180 0 0 1 436 262" stroke="#D97757" marker-end="url(#aC)"/>
    <path d="M352 424 A180 180 0 0 1 172 430" stroke="#8B7CF6" marker-end="url(#aG)"/>
    <path d="M76 274 A180 180 0 0 1 134 138" stroke="#8D96A3" marker-end="url(#aK)"/>
  </g>

  <!-- Claude (top) -->
  <g transform="translate(256 132)">
    <path d="M-74 -52 h148 a30 30 0 0 1 30 30 v52 a30 30 0 0 1 -30 30 h-44 l-30 26 l-4 -26 h-70 a30 30 0 0 1 -30 -30 v-52 a30 30 0 0 1 30 -30 z" fill="url(#cla)"/>
    <circle cx="-34" cy="4" r="11" fill="#fff"/><circle cx="0" cy="4" r="11" fill="#fff"/><circle cx="34" cy="4" r="11" fill="#fff" opacity=".55"/>
  </g>
  <!-- Gemini (bottom right) -->
  <g transform="translate(372 352)">
    <path d="M-74 -52 h148 a30 30 0 0 1 30 30 v52 a30 30 0 0 1 -30 30 h-70 l-4 26 l-30 -26 h-44 a30 30 0 0 1 -30 -30 v-52 a30 30 0 0 1 30 -30 z" fill="url(#gem)"/>
    <path d="M0 -26 C3 -6 6 -3 26 0 C6 3 3 6 0 26 C-3 6 -6 3 -26 0 C-6 -3 -3 -6 0 -26 z" fill="#fff"/>
  </g>
  <!-- Grok (bottom left) -->
  <g transform="translate(140 352)">
    <path d="M-74 -52 h148 a30 30 0 0 1 30 30 v52 a30 30 0 0 1 -30 30 h-44 l-30 26 l-4 -26 h-70 a30 30 0 0 1 -30 -30 v-52 a30 30 0 0 1 30 -30 z" fill="url(#grk)" stroke="#C9D1D9" stroke-width="5"/>
    <path d="M-22 -22 L22 22 M22 -22 L-22 22" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
    <text x="400" y="178" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#word)">TagTeam</text>
    <text x="404" y="232" font-size="30" font-weight="600" fill="#E6EDF3">One conversation. Three AIs. Zero lost context.</text>
    <text x="404" y="270" font-size="20" fill="#9AA4B2">Hit a usage limit? Tag out — the next AI picks up the same chat, mid-task.</text>

    <g font-size="17" font-weight="600">
      <rect x="404" y="298" width="150" height="40" rx="20" fill="#D97757" fill-opacity=".16" stroke="#D97757"/>
      <text x="479" y="324" text-anchor="middle" fill="#F4A481">Claude Code</text>
      <rect x="568" y="298" width="226" height="40" rx="20" fill="#7C6CF6" fill-opacity=".16" stroke="#8B7CF6"/>
      <text x="681" y="324" text-anchor="middle" fill="#C9B8FF">Gemini · Antigravity</text>
      <rect x="808" y="298" width="130" height="40" rx="20" fill="#C9D1D9" fill-opacity=".10" stroke="#8D96A3"/>
      <text x="873" y="324" text-anchor="middle" fill="#E6EDF3">Grok CLI</text>
    </g>
  </g>
</svg>
