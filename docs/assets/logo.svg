<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">TagTeam logo: three chat bubbles passing one conversation around a loop</title>
  <defs>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DF6"/>
      <stop offset="1" stop-color="#A86CF5"/>
    </linearGradient>
    <linearGradient id="cla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8906F"/>
      <stop offset="1" stop-color="#C8603F"/>
    </linearGradient>
    <linearGradient id="grk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A505C"/>
      <stop offset="1" stop-color="#14171D"/>
    </linearGradient>
    <marker id="aC" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97757"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8B7CF6"/>
    </marker>
    <marker id="aK" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8D96A3"/>
    </marker>
  </defs>

  <!-- relay loop: each arc leaves one AI and reaches the next -->
  <g fill="none" stroke-width="16" stroke-linecap="round">
    <path d="M359 123 A180 180 0 0 1 436 262" stroke="#D97757" marker-end="url(#aC)"/>
    <path d="M352 424 A180 180 0 0 1 172 430" stroke="#8B7CF6" marker-end="url(#aG)"/>
    <path d="M76 274 A180 180 0 0 1 134 138" stroke="#8D96A3" marker-end="url(#aK)"/>
  </g>

  <!-- Claude (top) -->
  <g transform="translate(256 132)">
    <path d="M-74 -52 h148 a30 30 0 0 1 30 30 v52 a30 30 0 0 1 -30 30 h-44 l-30 26 l-4 -26 h-70 a30 30 0 0 1 -30 -30 v-52 a30 30 0 0 1 30 -30 z" fill="url(#cla)"/>
    <circle cx="-34" cy="4" r="11" fill="#fff"/><circle cx="0" cy="4" r="11" fill="#fff"/><circle cx="34" cy="4" r="11" fill="#fff" opacity=".55"/>
  </g>
  <!-- Gemini (bottom right) -->
  <g transform="translate(372 352)">
    <path d="M-74 -52 h148 a30 30 0 0 1 30 30 v52 a30 30 0 0 1 -30 30 h-70 l-4 26 l-30 -26 h-44 a30 30 0 0 1 -30 -30 v-52 a30 30 0 0 1 30 -30 z" fill="url(#gem)"/>
    <path d="M0 -26 C3 -6 6 -3 26 0 C6 3 3 6 0 26 C-3 6 -6 3 -26 0 C-6 -3 -3 -6 0 -26 z" fill="#fff"/>
  </g>
  <!-- Grok (bottom left) -->
  <g transform="translate(140 352)">
    <path d="M-74 -52 h148 a30 30 0 0 1 30 30 v52 a30 30 0 0 1 -30 30 h-44 l-30 26 l-4 -26 h-70 a30 30 0 0 1 -30 -30 v-52 a30 30 0 0 1 30 -30 z" fill="url(#grk)" stroke="#C9D1D9" stroke-width="5"/>
    <path d="M-22 -22 L22 22 M22 -22 L-22 22" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
